<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel D&amp;V</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel D&amp;V">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="O seu Painel D&amp;V">
<meta property="og:description" content="Toques na sua placa NFC e evolução das suas avaliações Google, num só sítio.">
<meta property="og:image" content="https://dvplacasnfc.pt/social/og-site.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0e'/%3E%3Cpath d='M26 22a14 14 0 0 1 0 20M33 17a21 21 0 0 1 0 30M40 12a28 28 0 0 1 0 40' fill='none' stroke='%23d4ad5b' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../social/icon-painel.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#0c0c0e;--card:#17171b;--card2:#1e1e23;--line:#2b2a30;--fg:#f3efe6;--muted:#a9a397;--gold:#d4ad5b;--gold2:#f0d38d;--ok:#7fd3a0;--bad:#ff8f8f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(212,173,91,.18),transparent 45%),var(--bg);color:var(--fg);font-family:"Figtree","Segoe UI",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;font-family:"Sora",sans-serif;font-weight:800;font-size:17px}
.top svg{width:30px;height:30px}.top small{color:var(--muted);font-weight:600;font-size:12px}
h1{font-family:"Sora",sans-serif;font-size:28px;line-height:1.15;margin:22px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .n{font-family:"Sora",sans-serif;font-size:34px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi .d{font-size:13px;margin-top:2px}.up{color:var(--ok)}.down{color:var(--bad)}.muted{color:var(--muted)}
.kpi.gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,173,91,.12),var(--card) 60%)}
.star{color:var(--gold)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
section h2{font-family:"Sora",sans-serif;font-size:17px;margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--gold2),var(--gold));min-height:3px}
.bar b{font-size:12px;font-weight:700}.bar span{font-size:11px;color:var(--muted);text-transform:capitalize}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:700 16px/1 "Figtree",sans-serif;text-decoration:none;cursor:pointer}
.btn.wa{background:#25d366;color:#05210f;border-color:transparent}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;border-color:transparent}
.btn svg{width:20px;height:20px}
.qr{display:none;margin-top:12px;text-align:center}.qr.on{display:block}
.qr div{display:inline-block;background:#fff;padding:14px;border-radius:14px}
.qr p{font-size:13px;color:var(--muted)}
.tip{font-size:13px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:14px;margin-top:14px}
.empty{color:var(--muted);font-size:14px}
.skel{height:90px;border-radius:18px;background:linear-gradient(90deg,#1c1c21,#25252b,#1c1c21);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.pro{border-color:var(--gold);position:relative;overflow:hidden}
.pro-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:var(--gold);color:#1a1408;margin-bottom:10px}
.locked{filter:blur(5px);opacity:.55;height:110px}
.pro-lista{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.pro-lista li::before{content:"✓ ";color:var(--gold);font-weight:800}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#17171b" stroke="#2b2a30"/><path d="M24 22a14 14 0 0 1 0 20M31 17a21 21 0 0 1 0 30M38 12a28 28 0 0 1 0 40" fill="none" stroke="#d4ad5b" stroke-width="5" stroke-linecap="round"/></svg><span>Painel D&amp;V <small>Placas NFC</small></span></div>
  <main id="app" aria-live="polite"><h1>A carregar…</h1><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
  <p class="foot">Painel grátis incluído na sua placa · <a href="../">D&amp;V Placas NFC</a></p>
</div>
<script src="../config.js"></script>
<script src="../js/pro.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.SITE_CONFIG || {};
  var codigo = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z2-9]/g, "");
  var app = document.getElementById("app");
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
  function n(x) { return (x == null ? "–" : Number(x).toLocaleString("pt-PT")); }
  function mesNome(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString("pt-PT", { month: "short" }).replace(".", ""); }
  function mesKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function falha(t) { app.innerHTML = "<h1>Painel indisponível</h1><p class='sub'>" + esc(t) + "</p>"; }
  if (!codigo) { falha("Este link não é válido. Peça um novo à D&V Placas NFC."); return; }
  try { localStorage.setItem("painel-dv", codigo); } catch (e) {}

  fetch(C.supabaseUrl + "/rest/v1/rpc/painel_dados", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: C.supabaseAnonKey, Authorization: "Bearer " + C.supabaseAnonKey },
    body: JSON.stringify({ p_codigo: codigo })
  }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (!d) { falha("Este link não é válido. Peça um novo à D&V Placas NFC."); return; }
    document.title = "Painel · " + d.nome;
    var hoje = new Date(), mk = mesKey(hoje), ma = mesKey(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1));
    var porMes = {}; (d.toquesMeses || []).forEach(function (m) { porMes[m.mes] = +m.n; });
    var tMes = porMes[mk] || 0, tAnt = porMes[ma] || 0;
    var aval = d.aval || [], ult = aval.length ? aval[aval.length - 1] : null;
    var base = d.base && d.base.n != null ? +d.base.n : null;
    var agora = ult ? +ult.n : null, nota = ult && ult.nota != null ? ult.nota : null;
    var novas = base != null && agora != null ? agora - base : null;
    var reviewUrl = d.placeId ? "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(d.placeId) : "";

    var h = "<h1>Olá, " + esc(d.nome) + "!</h1><p class='sub'>Placa instalada em " + new Date(d.instalada).toLocaleDateString("pt-PT") + (ult ? " · Avaliações atualizadas em " + new Date(ult.data).toLocaleDateString("pt-PT") : "") + "</p>";
    var pedirPro = (function () {
      var t = "Olá! Sou da " + d.nome + " e gostava de ativar o Plano Pro do meu Painel D&V.";
      var w = String(C.whatsapp || "").replace(/\D/g, ""); if (w.length === 9) w = "351" + w;
      return w.length >= 11 ? "https://wa.me/" + w + "?text=" + encodeURIComponent(t) : "https://ig.me/m/dv_placasnfc";
    })();
    h += "<div class='grid'>";
    if (d.pro && d.gerido) {
      h += "<div class='kpi gold'><div class='l'>Toques este mês</div><div class='n'>" + n(tMes) + "</div><div class='d " + (tMes > tAnt ? "up" : "muted") + "'>" + (tMes > tAnt ? "▲ Já mais que o mês anterior (" + n(tAnt) + ")" : "Mês anterior: " + n(tAnt)) + "</div></div>";
      h += "<div class='kpi'><div class='l'>Toques desde o início</div><div class='n'>" + n(d.toquesTotal) + "</div><div class='d muted'>Clientes que tocaram na placa</div></div>";
    }
    h += "<div class='kpi" + (d.gerido ? "" : " gold") + "'><div class='l'>Avaliações Google</div><div class='n'>" + n(agora) + "</div><div class='d " + (novas > 0 ? "up" : "muted") + "'>" + (novas != null ? (novas > 0 ? "▲ +" + novas + " desde a placa" : "Antes: " + n(base)) : "A recolher dados") + "</div></div>";
    h += "<div class='kpi'><div class='l'>Nota no Google</div><div class='n'>" + (nota != null ? String(nota).replace(".", ",") + " <span class='star'>★</span>" : "–") + "</div><div class='d muted'>" + (base != null ? "Antes da placa: " + n(base) + " avaliações" : "") + "</div></div>";
    h += "</div>";

    if (d.pro && d.gerido) {
      var meses = []; for (var i = 5; i >= 0; i--) meses.push(mesKey(new Date(hoje.getFullYear(), hoje.getMonth() - i, 1)));
      var max = Math.max.apply(null, meses.map(function (m) { return porMes[m] || 0; }).concat([1]));
      if (d.periodos) h += "<section class='card'><h2>Toques na placa</h2>" + DVPro.kpis(d.periodos) + "</section>";
      h += "<section class='card'><h2>Quando tocam mais? <small class='muted' style='font-weight:500;font-size:12px'>últimos 90 dias</small></h2><div id='mapaReal'></div></section>";
      h += "<section class='card'><h2>Toques por mês</h2><div class='bars'>" + meses.map(function (m) { var v = porMes[m] || 0; return "<div class='bar'><b>" + v + "</b><i style='height:" + Math.max(2, v / max * 100) + "%'></i><span>" + mesNome(m) + "</span></div>"; }).join("") + "</div></section>";
    } else if (d.pro) {
      h += "<div class='tip'>A contagem de toques está disponível com o <b>link gerido</b>. Fale connosco para ativar.</div>";
    } else {
      h += "<section class='card pro'><div class='pro-tag'>PLANO PRO</div><h2>Experimente o Plano Pro</h2><p class='sub' style='margin-bottom:14px'>Veja com dados de exemplo o que este painel mostra com o Plano Pro: quantos clientes tocam na sua placa, a que horas e como crescem as avaliações.</p><div id='proDemo'></div>" +
        "<a class='btn gold' style='margin-top:14px' href='" + pedirPro + "' target='_blank' rel='noopener'>Ativar o Plano Pro</a></section>";
    }

    if (aval.length || base != null) {
      h += "<section class='card'><h2>Avaliações no Google</h2>" + DVPro.evolucaoDe(aval, d.base, d.instalada) + "</section>";
    }

    if (reviewUrl) {
      var msg = "Olá! Obrigado pela visita à " + d.nome + " 😊 Se gostou, deixe-nos uma avaliação no Google, ajuda muito: " + reviewUrl;
      h += "<section class='card'><h2>Peça mais avaliações</h2><p class='sub' style='margin-bottom:12px'>Envie o link de avaliação aos seus clientes. Quem acabou de ser bem atendido é quem mais avalia.</p><div class='btns'>";
      h += "<a class='btn wa' href='https://wa.me/?text=" + encodeURIComponent(msg) + "' target='_blank' rel='noopener'><svg viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z'/></svg>Enviar por WhatsApp</a>";
      h += "<a class='btn' href='mailto:?subject=" + encodeURIComponent("A sua opinião é importante para nós") + "&body=" + encodeURIComponent(msg) + "'>✉️ Enviar por email</a>";
      h += "<button class='btn' id='copiar' type='button'>🔗 Copiar link de avaliação</button>";
      h += "<button class='btn gold' id='verQr' type='button'>Mostrar QR code para imprimir</button></div>";
      h += "<div class='qr' id='qr'><div id='qrImg'></div><p>Imprima e coloque em faturas, sacos ou no balcão.</p></div></section>";
    }
    h += "<div class='tip'>📲 <b>Guarde este painel no telemóvel:</b> no iPhone toque em Partilhar → <i>Adicionar ao ecrã principal</i>; no Android, menu ⋮ → <i>Adicionar ao ecrã principal</i>.</div>";
    app.innerHTML = h;
    var mr = document.getElementById("mapaReal"); if (mr) DVPro.mapa(mr, d.mapa || [], { periodo: "em 90 dias" });
    var pdm = document.getElementById("proDemo"); if (pdm) DVPro.demo(pdm, { nome: "Café Aurora", cta: function () { window.open(pedirPro, "_blank", "noopener"); }, ctaTexto: "Ativar o Plano Pro" });

    var cp = document.getElementById("copiar");
    if (cp) cp.addEventListener("click", function () {
      (navigator.clipboard ? navigator.clipboard.writeText(reviewUrl) : Promise.reject()).then(function () { cp.textContent = "✓ Link copiado"; }).catch(function () { prompt("Copie o link:", reviewUrl); });
    });
    var vq = document.getElementById("verQr");
    if (vq) vq.addEventListener("click", function () {
      var box = document.getElementById("qr");
      if (!box.classList.contains("on") && window.qrcode) {
        var q = window.qrcode(0, "M"); q.addData(reviewUrl); q.make();
        document.getElementById("qrImg").innerHTML = q.createSvgTag({ cellSize: 6, margin: 0 });
      }
      box.classList.toggle("on");
      vq.textContent = box.classList.contains("on") ? "Esconder QR code" : "Mostrar QR code para imprimir";
    });
  }).catch(function () { falha("Sem ligação à internet. Tente outra vez."); });
})();
</script>
</body>
</html>
